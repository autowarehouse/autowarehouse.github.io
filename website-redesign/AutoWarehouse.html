document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

h1>\n              <p style=\"margin:22px 0 0;font:400 14px/1.6 'JetBrains Mono',monospace;color:rgba(214,224,216,.6)\">Every ETL run is a traceable route. Every AI mapping carries a confidence score and an approval state. Inspect the line, don't trust the box.<\u002Fp>\n              <div style=\"display:flex;gap:11px;margin-top:28px\">\n                <a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:#ffb000;color:#0a0c0f;border:1px solid #ffb000;border-radius:6px;font:700 12px 'JetBrains Mono',monospace;text-transform:uppercase\" style-hover=\"background:#ffc640\">./book-review.sh →<\u002Fa>\n                <a href=\"#\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;color:#d6e0d8;border:1px solid rgba(214,224,216,.3);border-radius:6px;font:700 12px 'JetBrains Mono',monospace;text-transform:uppercase\" style-hover=\"border-color:#41d18a;color:#41d18a\">--read-docs<\u002Fa>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:26px;margin-top:30px;border-top:1px solid rgba(255,176,0,.18);padding-top:18px\">\n                <div><div data-count=\"214\" data-suffix=\"+\" style=\"font:700 28px 'Space Grotesk',sans-serif;color:#ffb000\">0<\u002Fdiv><div style=\"font:500 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:rgba(214,224,216,.5)\">sources<\u002Fdiv><\u002Fdiv>\n                <div><div data-count=\"99.4\" data-suffix=\"%\" style=\"font:700 28px 'Space Grotesk',sans-serif;color:#41d18a\">0<\u002Fdiv><div style=\"font:500 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:rgba(214,224,216,.5)\">auto-mapped<\u002Fdiv><\u002Fdiv>\n                <div><div data-count=\"3\" style=\"font:700 28px 'Space Grotesk',sans-serif;color:#f25c1f\">0<\u002Fdiv><div style=\"font:500 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:rgba(214,224,216,.5)\">held for review<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- right: streaming log -->\n            <div style=\"padding:30px 26px;background:#070a0d;font:400 13px/1.9 'JetBrains Mono',monospace\">\n              <div style=\"color:rgba(214,224,216,.4);margin-bottom:8px\">// build.log — autowarehouse runner<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 0s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> connect 214 sources · profiling…<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease .7s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> classify columns · PII flagged: 12<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 1.4s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> cast DataModel <span style=\"color:#ffb000\">HRDM<\u002Fspan> · 3 layers<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 2.1s infinite\"><span style=\"color:#ffb000\">[hold]<\u002Fspan> 3 low-confidence mappings → review<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 2.8s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> human approved · gate cleared<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 3.5s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> generate DDL · 38 objects<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 4.2s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> load SCD2 dimensions<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 4.9s infinite\"><span style=\"color:#41d18a\">[ok]<\u002Fspan> quality gate · 0 violations<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 5.6s infinite\"><span style=\"color:#ffb000\">[run]<\u002Fspan> DAG executing · 5/5 stations<\u002Fdiv>\n              <div style=\"opacity:0;animation:awLog 9s ease 6.3s infinite\"><span style=\"color:#41d18a\">[done]<\u002Fspan> warehouse ready · answers live<\u002Fdiv>\n              <div style=\"margin-top:6px;color:#41d18a\"><span style=\"color:#ffb000\">$<\u002Fspan> _<span style=\"display:inline-block;width:8px;height:15px;background:#41d18a;margin-left:2px;vertical-align:-2px;animation:awBlink 1.1s step-end infinite\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n  <p class=\"dv-next\">Try next: \"build the full site from <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>\" · \"make <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>'s headline even bigger\" · \"combine <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>'s log with <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>'s reactor\" · \"new directions\"<\u002Fp>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;AutoWarehouse&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;countUp&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { brand: this.props.brand ?? 'AutoWarehouse' };\n  }\n\n  fmt(el, value) {\n    const raw = el.dataset.count;\n    const dec = (raw.split('.')[1] || '').length;\n    const pre = el.dataset.prefix || '';\n    const suf = el.dataset.suffix || '';\n    const n = Number(value.toFixed(dec));\n    return pre + n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;\n  }\n\n  componentDidMount() {\n    const countUp = this.props.countUp ?? true;\n    const els = Array.from(document.querySelectorAll('[data-count]'));\n    if (!countUp) {\n      els.forEach(el => { el.textContent = this.fmt(el, parseFloat(el.dataset.count)); });\n      return;\n    }\n    // Use a timer (not requestAnimationFrame): rAF and IntersectionObserver\n    // are throttled/paused while the preview iframe is backgrounded, which\n    // would leave the counters stuck at 0.\n    const run = (el) => {\n      if (el.__done) return;\n      el.__done = true;\n      const target = parseFloat(el.dataset.count);\n      const dur = 1500, step = 30;\n      const t0 = Date.now();\n      const id = setInterval(() => {\n        const p = Math.min(1, (Date.now() - t0) / dur);\n        const eased = 1 - Math.pow(1 - p, 3);\n        el.textContent = this.fmt(el, target * eased);\n        if (p >= 1) clearInterval(id);\n      }, step);\n    };\n    let io = null;\n    if ('IntersectionObserver' in window) {\n      io = new IntersectionObserver((entries) => {\n        entries.forEach(e => { if (e.isIntersecting) run(e.target); });\n      }, { threshold: 0.35 });\n      els.forEach(el => io.observe(el));\n      this._io = io;\n    }\n    // Fallback: IntersectionObserver can fail to fire in some iframe/preview\n    // environments — kick off any counters not yet started after a short delay.\n    this._fallback = setTimeout(() => {\n      Array.from(document.querySelectorAll('[data-count]')).forEach(run);\n    }, 700);\n  }\n\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._fallback) clearTimeout(this._fallback);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
